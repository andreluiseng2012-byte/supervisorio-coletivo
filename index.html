<!DOCTYPE html>
<html lang="pt-BR">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supervisório Duplex</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout geral e reset básico */
*{box-sizing:border-box}
body{margin:0;background:#10141f;color:#fff;font:12px Arial;text-align:center}
h2{text-align:left;margin:8px 15px}
.box{display:flex;gap:6px;justify-content:center;align-items:flex-start}
#telaElevadores{width:100%;height:calc(100vh - 68px);display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#telaElevadores .box{transform-origin:top center}

/* Cabeçalho com o nome do app e botão de configuração */
.topo{position:relative;background:#141a2e;padding:20px 16px;border-bottom:1px solid #232a44}
.topo h1{margin:0;font-size:26px;font-weight:800;color:#fff;text-align:center}
.btn-config{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#232a44;border:1px solid #35d9ff;color:#35d9ff;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer}
.btn-config:active{transform:translateY(-50%) scale(0.95)}

/* Painéis de botões dentro de cada elevador (cabine) - grade que comporta N elevadores */
.paineis{display:grid;grid-template-columns:repeat(2,82px);grid-auto-rows:366px;gap:6px}
.painel{width:82px;height:366px;background:linear-gradient(135deg,#c8ccd0,#9aa0a6 40%,#c8ccd0 60%,#8a9096);border:3px solid #6b7076;padding:4px;box-shadow:inset 0 1px 3px rgba(255,255,255,.4);position:relative}

/* Identificação colorida de cada elevador (borda + brilho + etiqueta) */
.identificacao-elevador{width:100%;height:23px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;border-radius:4px;background:#161b27;color:#fff;font-size:9px;font-weight:bold;letter-spacing:.4px;text-shadow:0 0 4px currentColor}
.painel-elevador-1{border-color:#35a7ff;box-shadow:0 0 7px rgba(53,167,255,.55),inset 0 1px 3px rgba(255,255,255,.4)}
.painel-elevador-2{border-color:#35e06f;box-shadow:0 0 7px rgba(53,224,111,.55),inset 0 1px 3px rgba(255,255,255,.4)}
.painel-elevador-3{border-color:#b66cff;box-shadow:0 0 7px rgba(182,108,255,.55),inset 0 1px 3px rgba(255,255,255,.4)}
.painel-elevador-4{border-color:#ff8c32;box-shadow:0 0 7px rgba(255,140,50,.55),inset 0 1px 3px rgba(255,255,255,.4)}
.painel-elevador-1 .identificacao-elevador{color:#35a7ff;border:1px solid #35a7ff}
.painel-elevador-2 .identificacao-elevador{color:#35e06f;border:1px solid #35e06f}
.painel-elevador-3 .identificacao-elevador{color:#b66cff;border:1px solid #b66cff}
.painel-elevador-4 .identificacao-elevador{color:#ff8c32;border:1px solid #ff8c32}
.painel-elevador-1 .botao{border-color:#35a7ff}
.painel-elevador-2 .botao{border-color:#35e06f}
.painel-elevador-3 .botao{border-color:#b66cff}
.painel-elevador-4 .botao{border-color:#ff8c32}
.painel-elevador-1 .botao.ativo{border-color:#35a7ff;box-shadow:0 0 10px #35a7ff,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.painel-elevador-2 .botao.ativo{border-color:#35e06f;box-shadow:0 0 10px #35e06f,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.painel-elevador-3 .botao.ativo{border-color:#b66cff;box-shadow:0 0 10px #b66cff,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.painel-elevador-4 .botao.ativo{border-color:#ff8c32;box-shadow:0 0 10px #ff8c32,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}

/* Modo independente = amarelo */
.painel-independente{border-color:#ffb52e !important;box-shadow:0 0 9px rgba(255,181,46,.65),inset 0 1px 3px rgba(255,255,255,.4) !important}
.painel-independente .botao{border-color:#ffb52e !important}
.painel-independente .botao.ativo{border-color:#ffb52e !important;box-shadow:0 0 10px #ffb52e,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.painel-independente .identificacao-elevador{color:#ffb52e !important;border-color:#ffb52e !important}

/* Bloqueado = vermelho (tem prioridade sobre o amarelo) */
.painel-bloqueado{opacity:.65;border-color:#ff3030 !important;box-shadow:0 0 10px rgba(255,48,48,.7),inset 0 1px 3px rgba(255,255,255,.4) !important}
.painel-bloqueado .botao{border-color:#ff3030 !important}
.painel-bloqueado .identificacao-elevador{color:#ff3030 !important;border-color:#ff3030 !important}

.painel-botoes{height:326px;display:grid;grid-template-columns:33px 33px;grid-template-rows:52px repeat(5,45px);gap:3px;justify-content:center}
.display{width:68px;height:48px;margin:auto;background:#55d52f;border:3px inset #222;color:#000;font:bold 25px monospace;display:grid;place-items:center;box-shadow:inset 0 0 8px #173b10}
.painel-botoes .display{grid-column:1/3}
.botao{width:33px;height:38px;border-radius:50%;border:2px solid #6b7076;
  background:radial-gradient(circle at 35% 30%,#f5f6f7,#c9cdd1 45%,#9aa0a6 75%,#7d8388);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.4);
  font-weight:bold;padding:0;font-size:14px;color:#2a2d30;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.ativo{border:2px solid #35d9ff;box-shadow:0 0 10px #35d9ff,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.botao:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}

/* Poço onde as cabines se movem - largura é definida via JS conforme o nº de elevadores */
#poco{position:relative;height:700px;background:#555;border:5px solid #333;overflow:hidden}
.linha-andar{position:absolute;left:0;width:100%;height:2px;background:#ddd}
.cabine{position:absolute;height:66px;bottom:0;background:#777;border:4px solid #111;z-index:2;box-shadow:0 2px 6px #111;transition:border-color .2s ease,box-shadow .2s ease}
.cabine-elevador-1{border-color:#35a7ff;box-shadow:0 0 8px rgba(53,167,255,.75),0 2px 6px #111}
.cabine-elevador-2{border-color:#35e06f;box-shadow:0 0 8px rgba(53,224,111,.75),0 2px 6px #111}
.cabine-elevador-3{border-color:#b66cff;box-shadow:0 0 8px rgba(182,108,255,.75),0 2px 6px #111}
.cabine-elevador-4{border-color:#ff8c32;box-shadow:0 0 8px rgba(255,140,50,.75),0 2px 6px #111}
.cabine-independente{border-color:#ffb52e !important;box-shadow:0 0 10px rgba(255,181,46,.9),0 2px 6px #111 !important}
.cabine-bloqueada{border-color:#ff3030 !important;box-shadow:0 0 10px rgba(255,48,48,.9),0 2px 6px #111 !important}
.luz-interna{position:absolute;inset:0;background:#fff;opacity:0}
.parada .luz-interna{opacity:1}
.porta{position:absolute;inset:0;overflow:hidden;z-index:3}
.folha{position:absolute;top:0;width:50%;height:100%;background:#777;border:2px solid #222;transition:.8s}
.folha:first-child{left:0}
.folha:last-child{right:0}
.aberta .folha:first-child{left:-50%}
.aberta .folha:last-child{right:-50%}
.pessoas{position:absolute;left:-20px;top:10px;width:80px;height:55px;z-index:5}
.pessoa{position:absolute;bottom:0;width:8px;height:24px;background:#222;border-radius:5px;opacity:0}
.pessoa:before{content:"";position:absolute;width:8px;height:8px;background:#222;border-radius:50%;top:-8px}
.entrando{animation:andar 2s linear forwards}
@keyframes andar{0%{left:-12px;opacity:1}100%{left:35px;opacity:1}}

/* Coluna de botões de chamada em cada pavimento */
#pavimentos{width:125px;height:700px;display:flex;flex-direction:column}
.pavimento{width:125px;height:70px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#c8ccd0,#9aa0a6 40%,#c8ccd0 60%,#8a9096);border:3px solid #6b7076;flex:none;box-shadow:inset 0 1px 3px rgba(255,255,255,.4)}
.pavimento .display{width:48px;height:38px;font-size:20px}
.pavimento .botao{width:34px;height:34px}

/* Animação de toque: afunda enquanto o dedo está no botão, volta assim que solta */
button{transition:transform .06s ease,filter .06s ease,background-color .06s ease}
.botao:active{transform:scale(0.93);filter:brightness(0.8)}

/* ===== Modal de configuração ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-painel{background:#1b2136;border:1px solid #2c3454;border-radius:10px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:16px;text-align:left}
.modal-cabecalho{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal-cabecalho h3{margin:0;font-size:17px}
.botao-fechar{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.abas-elevador{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0 14px}
.aba-elevador{padding:9px 4px;background:#232a44;border:1px solid #343d5e;color:#aab0c8;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold}
.aba-elevador.ativa{background:#35d9ff;border-color:#35d9ff;color:#0b0e1a}
.status-elevador{background:#141a2e;border:1px solid #2c3454;border-radius:6px;padding:8px 10px;font-size:12px;color:#9fe8ff;margin-bottom:12px}
.linha-toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 16px;font-size:13px}
.linha-toggle input{width:20px;height:20px}
.aviso-independente{background:#332b17;border:1px solid #8b6d24;color:#ffd76a;border-radius:7px;padding:9px;margin-bottom:10px;font-size:12px}
.config-corpo h4{margin:0 0 8px;font-size:13px;color:#aab0c8}
.linha-restricao{background:#141a2e;border:1px solid #2c3454;border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px}
.dias-semana{display:flex;justify-content:space-between;margin-bottom:8px}
.dias-semana label{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#aab0c8}
.dias-semana input{width:16px;height:16px}
.horarios,.faixa-andares{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.horarios input,.faixa-andares select{background:#0f1424;border:1px solid #343d5e;color:#fff;border-radius:5px;padding:5px;font-size:12px}
.remover-restricao{width:100%;background:#3a1f28;border:1px solid #6b2f3e;color:#ff8fa3;border-radius:6px;padding:7px;font-size:12px;cursor:pointer}
.botao-secundario{width:100%;background:#1c2440;border:1px dashed #35d9ff;color:#35d9ff;border-radius:6px;padding:9px;font-size:13px;cursor:pointer;margin-bottom:6px}
.config-rodape{margin-top:10px}
.botao-primario{width:100%;background:#35d9ff;border:none;color:#0b0e1a;border-radius:6px;padding:11px;font-size:14px;font-weight:bold;cursor:pointer}
</style>

<body>

<div class="topo">
  <h1>Supervisório Duplex</h1>
  <button id="btnConfig" class="btn-config" title="Configuração">⚙ Configuração</button>
</div>

<div id="telaElevadores">
<div class="box">
  <div class="paineis" id="paineis"></div>
  <div><b>POÇO</b><div id="poco"></div></div>
  <div><b>PAVIMENTOS</b><div id="pavimentos"></div></div>
</div>
</div>

<!-- Modal de configuração: seleção de equipamento, bloqueio, independente e restrição de andares por horário -->
<div id="modalConfig" class="modal-overlay">
  <div class="modal-painel">
    <div class="modal-cabecalho">
      <h3>Configuração</h3>
      <button id="fecharConfig" class="botao-fechar">✕</button>
    </div>

    <div class="abas-elevador" id="abasElevador"></div>

    <div id="statusElevador" class="status-elevador"></div>

    <label class="linha-toggle">
      <span>Bloquear elevador (fora de serviço)</span>
      <input type="checkbox" id="toggleBloqueio">
    </label>

    <label class="linha-toggle">
      <span>Funcionamento independente</span>
      <input type="checkbox" id="toggleIndependente">
    </label>

    <div class="config-corpo">
      <h4>Horários com restrição de andares</h4>
      <div id="avisoIndependente" class="aviso-independente" style="display:none">
        No modo independente, as restrições de horário e faixa de andares ficam desabilitadas para este elevador.
      </div>
      <div id="listaRestricoes"></div>
      <button id="addRestricao" class="botao-secundario">+ Adicionar horário</button>
    </div>

    <div class="config-rodape">
      <button id="salvarConfig" class="botao-primario">Salvar</button>
    </div>
  </div>
</div>

<script>
/* ===== Configuração geral =====
   ANDARES: rótulos exibidos, do térreo (T) ao 9º andar.
   ALTURA_ANDAR: quantos pixels de altura cada andar ocupa no poço.
   ALTURA_MAX: limite superior de posição (topo do poço).
   NUM_ELEVADORES: quantidade de elevadores do sistema. Para adicionar mais
   no futuro, basta aumentar esse número - todo o resto (painéis, cabines,
   configuração) se adapta automaticamente. */
const ANDARES = ["T",1,2,3,4,5,6,7,8,9];
const ALTURA_ANDAR = 70;
const ALTURA_MAX = 630;
const NUM_ELEVADORES = 4;
const IDS_ELEVADORES = Array.from({length: NUM_ELEVADORES}, (_, i) => i + 1);

/* ===== Velocidade real do elevador =====
   Ajuste só estes dois valores caso troque de elevador ou receba
   uma velocidade diferente do técnico - o resto se recalcula sozinho. */
const VELOCIDADE_REAL_MS = 1;       // velocidade do elevador real (m/s)
const ALTURA_REAL_ANDAR_M = 3;      // altura real entre andares (m)
const SEGUNDOS_POR_ANDAR = ALTURA_REAL_ANDAR_M / VELOCIDADE_REAL_MS; // = 3s
const FATOR_VELOCIDADE = (ALTURA_ANDAR / SEGUNDOS_POR_ANDAR / 60) / 2.8;

const poco = document.getElementById("poco");
const listaPavimentos = document.getElementById("pavimentos");
const botoesPavimento = [];        // botão de chamada de cada andar
const chamadasPendentes = new Set(); // andares com chamada externa ainda não atendida

/* ===== Configuração de bloqueio, independente e restrição de andares por elevador =====
   Guardada no localStorage. Cada elevador tem:
   - bloqueado: true/false (fora de serviço, ignora qualquer chamada)
   - independente: true/false (ignora restrições de horário/andar e a lógica
     de duplex - atende sozinho qualquer chamada de fora que receber)
   - restricoes: lista de faixas de horário em que ele só atende
     um intervalo de andares (ex: seg-sex 7h-10h, só até o 5º andar) */
const CHAVE_CONFIG = "supervisorioConfig";

function configuracaoPadrao() {
  const cfg = {};
  IDS_ELEVADORES.forEach(id => cfg[id] = { bloqueado:false, independente:false, restricoes:[] });
  return cfg;
}
function carregarConfiguracao() {
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(CHAVE_CONFIG)); } catch (e) {}
  const padrao = configuracaoPadrao();
  if (!salvo) return padrao;
  IDS_ELEVADORES.forEach(id => {
    if (!salvo[id]) salvo[id] = padrao[id]; // preenche elevadores novos
    if (typeof salvo[id].independente !== "boolean") salvo[id].independente = false;
    if (!Array.isArray(salvo[id].restricoes)) salvo[id].restricoes = [];
  });
  return salvo;
}
function salvarConfiguracaoStorage() {
  localStorage.setItem(CHAVE_CONFIG, JSON.stringify(configuracao));
}
let configuracao = carregarConfiguracao();

function elevadorBloqueado(id) {
  return !!(configuracao[id] && configuracao[id].bloqueado);
}
function elevadorIndependente(id) {
  return !!(configuracao[id] && configuracao[id].independente);
}
/* Retorna a restrição de horário ativa agora para o elevador, ou null se nenhuma
   (elevador independente nunca tem restrição de horário ativa) */
function restricaoAtiva(id) {
  const cfg = configuracao[id];
  if (!cfg) return null;
  if (cfg.independente) return null;
  const agora = new Date();
  const dia = agora.getDay(); // 0=domingo ... 6=sábado
  const minutosAgora = agora.getHours() * 60 + agora.getMinutes();
  return cfg.restricoes.find(r => {
    if (!r.dias.includes(dia)) return false;
    const [hi, mi] = r.inicio.split(":").map(Number);
    const [hf, mf] = r.fim.split(":").map(Number);
    const minutosInicio = hi * 60 + mi, minutosFim = hf * 60 + mf;
    return minutosAgora >= minutosInicio && minutosAgora < minutosFim;
  }) || null;
}
/* O elevador pode atender esse andar agora? (considera bloqueio, independente e restrição de horário) */
function andarPermitido(id, andar) {
  if (elevadorBloqueado(id)) return false;
  if (elevadorIndependente(id)) return true;
  const r = restricaoAtiva(id);
  if (!r) return true;
  return andar >= r.min && andar <= r.max;
}

/* Cria os painéis (um por elevador) com etiqueta de identificação colorida e
   display, antes de criar o objeto de estado de cada elevador */
const paineisContainer = document.getElementById("paineis");
IDS_ELEVADORES.forEach(id => {
  const painel = document.createElement("div");
  painel.className = "painel painel-elevador-" + id;

  const identificacao = document.createElement("div");
  identificacao.className = "identificacao-elevador";
  identificacao.textContent = "ELEVADOR " + id;
  painel.appendChild(identificacao);

  const painelBotoes = document.createElement("div");
  painelBotoes.id = "painel" + id;
  painelBotoes.className = "painel-botoes";
  const display = document.createElement("div");
  display.id = "display" + id;
  display.className = "display";
  display.textContent = "T";
  painelBotoes.appendChild(display);
  painel.appendChild(painelBotoes);
  paineisContainer.appendChild(painel);
});

/* Cria o objeto de estado de cada elevador (cabine).
   andarAtual: andar onde a cabine está agora.
   posicaoPx: posição vertical em pixels (para animação suave).
   direcao: 1 = subindo, -1 = descendo, 0 = parado.
   emMovimento: 1 enquanto a cabine está se deslocando.
   destinos: conjunto de andares que essa cabine ainda precisa visitar.
   botoesInternos: botões do painel dentro da cabine. */
const elevadores = IDS_ELEVADORES.map(id => ({
  id,
  andarAtual: 0,
  posicaoPx: 0,
  direcao: 0,
  emMovimento: 0,
  destinos: new Set(),
  botoesInternos: [],
  display: document.getElementById("display" + id)
}));

/* Desenha as linhas horizontais que marcam cada andar no poço */
for (let i = 0; i < ANDARES.length; i++) {
  poco.innerHTML += `<i class="linha-andar" style="bottom:${i * ALTURA_ANDAR}px"></i>`;
}

/* Largura do poço e posição horizontal de cada cabine, calculadas
   conforme a quantidade de elevadores (NUM_ELEVADORES) */
const CABINE_LARGURA_PX = 46;
const GAP_CABINE_PX = 8;
const MARGEM_POCO_PX = 6;
const LARGURA_POCO_PX = MARGEM_POCO_PX * 2 + NUM_ELEVADORES * CABINE_LARGURA_PX + (NUM_ELEVADORES - 1) * GAP_CABINE_PX;
poco.style.width = LARGURA_POCO_PX + "px";

/* Cria visualmente as cabines (com contorno colorido, luz, porta e espaço p/ pessoas) */
poco.innerHTML += elevadores.map((e, i) => {
  const esquerda = MARGEM_POCO_PX + i * (CABINE_LARGURA_PX + GAP_CABINE_PX);
  return `
  <div class="cabine cabine-elevador-${e.id}" id="cabine${e.id}" style="left:${esquerda}px;width:${CABINE_LARGURA_PX}px">
    <i class="luz-interna"></i>
    <div class="pessoas"></div>
    <div class="porta"><i class="folha"></i><i class="folha"></i></div>
  </div>`;
}).join("");

/* Liga cada elevador ao seu elemento visual e cria os botões internos (por andar) */
elevadores.forEach(e => {
  e.elemento = document.getElementById("cabine" + e.id);
  e.porta = e.elemento.querySelector(".porta");
  e.areaPessoas = e.elemento.querySelector(".pessoas");

  ANDARES.forEach((rotulo, i) => {
    const botao = document.createElement("button");
    botao.className = "botao";
    botao.textContent = rotulo;
    botao.style.gridRow = 2 + Math.floor((9 - i) / 2);
    botao.style.gridColumn = (i % 2) + 1;
    botao.onclick = () => chamarDeDentro(e, i, botao);
    e.botoesInternos[i] = botao;
    document.getElementById("painel" + e.id).append(botao);
  });
});

/* Cria os pavimentos (de cima para baixo) com display e botão de chamada externa */
for (let i = ANDARES.length - 1; i >= 0; i--) {
  const linha = document.createElement("div");
  linha.className = "pavimento";
  linha.innerHTML = `<div class="display">${ANDARES[i]}</div><button class="botao"></button>`;
  const botao = linha.querySelector(".botao");
  botao.onclick = () => chamarDeFora(i, botao);
  listaPavimentos.append(linha);
  botoesPavimento[i] = botao;
}

/* Passageiro aperta um botão DENTRO da cabine, pedindo para ir a um andar */
function chamarDeDentro(elevador, andar, botao) {
  if (elevadorBloqueado(elevador.id) || !andarPermitido(elevador.id, andar)) return;
  if (andar == elevador.andarAtual && !elevador.emMovimento) {
    return abrirPortas(elevador); // já está no andar: só abre a porta
  }
  elevador.destinos.add(andar);
  botao.classList.add("ativo");
  if (!elevador.emMovimento) proximoDestino(elevador);
}

/* Posição atual do elevador em "andares", considerando o deslocamento
   em tempo real quando ele está em movimento (não apenas o último
   andar registrado, que só é atualizado na chegada) */
function posicaoAtualEmAndares(elevador) {
  return elevador.emMovimento ? elevador.posicaoPx / ALTURA_ANDAR : elevador.andarAtual;
}

/* Alguém aperta o botão de chamada NO ANDAR (fora da cabine) */
function chamarDeFora(andar, botao) {
  if (chamadasPendentes.has(andar)) return; // já tem chamada nesse andar

  chamadasPendentes.add(andar);
  botao.classList.add("ativo");

  // Elevadores em modo independente têm prioridade: cada um atende sozinho,
  // fora da lógica de duplex e sem respeitar restrição de horário/andar
  const independentes = elevadores.filter(e => elevadorIndependente(e.id) && !elevadorBloqueado(e.id));
  if (independentes.length) {
    const escolhido = independentes.slice().sort((a, b) =>
      Math.abs(posicaoAtualEmAndares(a) - andar) - Math.abs(posicaoAtualEmAndares(b) - andar)
    )[0];
    escolhido.destinos.add(andar);
    if (!escolhido.emMovimento) proximoDestino(escolhido);
    return;
  }

  // Se algum elevador já está parado exatamente nesse andar e pode atendê-lo, atende na hora
  const jaParado = elevadores.find(e => !e.emMovimento && e.andarAtual == andar && andarPermitido(e.id, andar) && !elevadorIndependente(e.id));
  if (jaParado) return atenderChamadaImediata(jaParado, andar);

  // Se algum elevador já está EM MOVIMENTO indo na mesma direção, AINDA NÃO passou
  // por esse andar e pode atendê-lo agora, ele assume essa chamada também
  const emRota = elevadores.find(e => !elevadorIndependente(e.id) && e.emMovimento && andarPermitido(e.id, andar) &&
    ((e.direcao > 0 && andar > posicaoAtualEmAndares(e)) || (e.direcao < 0 && andar < posicaoAtualEmAndares(e))));
  if (emRota) { emRota.destinos.add(andar); return; }

  // Senão, despacha para o elevador livre mais próximo que possa atender esse andar
  despacharElevadoresLivres();
}

/* Distribui as chamadas pendentes entre os elevadores livres, não bloqueados e
   não independentes, escolhendo para cada um o andar pendente mais próximo que
   ele tem permissão de atender. */
function despacharElevadoresLivres() {
  elevadores.filter(e => !e.emMovimento && !elevadorBloqueado(e.id) && !elevadorIndependente(e.id)).forEach(e => {
    const maisProximo = [...chamadasPendentes]
      .filter(andar => andarPermitido(e.id, andar) && !e.destinos.has(andar) &&
        !elevadores.some(outro => outro !== e && !elevadorIndependente(outro.id) && outro.emMovimento && outro.destinos.has(andar)))
      .sort((a, b) => Math.abs(e.andarAtual - a) - Math.abs(e.andarAtual - b))[0];

    if (maisProximo != null) { e.destinos.add(maisProximo); proximoDestino(e); }
  });
}

/* Decide qual é o próximo andar a visitar, priorizando continuar
   na mesma direção que a cabine já estava seguindo. */
function proximoDestino(elevador) {
  if (!elevador.destinos.size) {
    elevador.emMovimento = elevador.direcao = 0;
    if (!elevadorIndependente(elevador.id)) despacharElevadoresLivres();
    agendarRetornoAoTerreo(elevador);
    return;
  }
  const acima = [...elevador.destinos].filter(a => a > elevador.andarAtual).sort((a, b) => a - b);
  const abaixo = [...elevador.destinos].filter(a => a < elevador.andarAtual).sort((a, b) => b - a);

  const destino =
    (elevador.direcao > 0 && acima.length) ? acima[0] :
    (elevador.direcao < 0 && abaixo.length) ? abaixo[0] :
    acima.length ? acima[0] : abaixo[0];

  moverAte(elevador, destino);
}

/* Se o elevador ficar ocioso (sem destino e sem nenhuma chamada pendente em nenhum andar),
   depois de um tempo parado ele volta sozinho pro térreo */
const TEMPO_ESPERA_RETORNO_TERREO = 6000; // 6 segundos parado antes de descer sozinho
function agendarRetornoAoTerreo(elevador) {
  setTimeout(() => {
    const aindaOcioso = !elevador.emMovimento && !elevador.destinos.size && !chamadasPendentes.size;
    if (aindaOcioso && elevador.andarAtual !== 0 && !elevadorBloqueado(elevador.id)) {
      elevador.destinos.add(0);
      proximoDestino(elevador);
    }
  }, TEMPO_ESPERA_RETORNO_TERREO);
}

/* Move a cabine, andar de posição em posição, até chegar ao andar de destino */
function moverAte(elevador, andarDestino) {
  elevador.emMovimento = 1;
  elevador.direcao = andarDestino > elevador.andarAtual ? 1 : -1;
  elevador.porta.classList.remove("aberta");

  setTimeout(() => {
    const alvoPx = andarDestino * ALTURA_ANDAR;

    function passoDaAnimacao() {
      const distancia = alvoPx - elevador.posicaoPx;
      const velocidade = Math.min(2.8, Math.max(0.4, Math.abs(distancia) / 35)) * FATOR_VELOCIDADE;

      elevador.posicaoPx += elevador.direcao * velocidade;
      elevador.posicaoPx = Math.max(0, Math.min(ALTURA_MAX, elevador.posicaoPx));
      elevador.elemento.style.bottom = elevador.posicaoPx + "px";
      elevador.display.textContent = ANDARES[Math.round(elevador.posicaoPx / ALTURA_ANDAR)];

      const chegou = (elevador.direcao > 0 && elevador.posicaoPx >= alvoPx) ||
                     (elevador.direcao < 0 && elevador.posicaoPx <= alvoPx);

      if (chegou) {
        elevador.posicaoPx = alvoPx;
        elevador.andarAtual = andarDestino;
        elevador.elemento.style.bottom = elevador.posicaoPx + "px";
        elevador.display.textContent = ANDARES[andarDestino];
        falarAndar(ANDARES[andarDestino]);
        elevador.destinos.delete(andarDestino);

        if (chamadasPendentes.has(andarDestino)) {
          chamadasPendentes.delete(andarDestino);
          botoesPavimento[andarDestino].classList.remove("ativo");
          elevadores.forEach(e => e.destinos.delete(andarDestino));
        }
        elevador.botoesInternos[andarDestino].classList.remove("ativo");
        abrirPortas(elevador);
        return;
      }
      requestAnimationFrame(passoDaAnimacao);
    }
    requestAnimationFrame(passoDaAnimacao);
  }, 300);
}

/* Usado quando a cabine já está parada bem no andar chamado: só abre a porta */
function atenderChamadaImediata(elevador, andar) {
  elevador.destinos.delete(andar);
  chamadasPendentes.delete(andar);
  botoesPavimento[andar].classList.remove("ativo");
  elevadores.forEach(e => e.destinos.delete(andar));
  abrirPortas(elevador);
}

/* Abre a porta, anima passageiros entrando, espera, fecha e segue viagem */
function abrirPortas(elevador) {
  elevador.elemento.classList.add("parada");
  elevador.porta.classList.add("aberta");
  elevador.areaPessoas.innerHTML = "";

  for (let i = 0; i < 2; i++) {
    const pessoa = document.createElement("i");
    pessoa.className = "pessoa entrando";
    pessoa.style.left = (-12 + i * 8) + "px";
    pessoa.style.animationDelay = i * 0.3 + "s";
    elevador.areaPessoas.append(pessoa);
  }

  setTimeout(() => {
    elevador.porta.classList.remove("aberta");
    setTimeout(() => {
      elevador.elemento.classList.remove("parada");
      elevador.areaPessoas.innerHTML = "";
      if (elevador.destinos.size) {
        proximoDestino(elevador);
      } else {
        elevador.emMovimento = elevador.direcao = 0;
        agendarRetornoAoTerreo(elevador);
      }
      if (!elevadorIndependente(elevador.id)) despacharElevadoresLivres();
    }, 800);
  }, 2000);
}

/* Registra o service worker para o app funcionar como PWA (offline/instalável) */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}

/* Som curto de toque em qualquer botão (gerado na hora, sem precisar de arquivo de áudio) */
let contextoAudio = null;
function tocarSomDeToque() {
  try {
    contextoAudio = contextoAudio || new (window.AudioContext || window.webkitAudioContext)();
    const osc = contextoAudio.createOscillator();
    const ganho = contextoAudio.createGain();
    osc.type = 'sine';
    osc.frequency.value = 850;
    ganho.gain.setValueAtTime(0.15, contextoAudio.currentTime);
    ganho.gain.exponentialRampToValueAtTime(0.001, contextoAudio.currentTime + 0.1);
    osc.connect(ganho);
    ganho.connect(contextoAudio.destination);
    osc.start();
    osc.stop(contextoAudio.currentTime + 0.1);
  } catch (e) { /* navegador sem suporte a áudio: ignora silenciosamente */ }
}
document.addEventListener('click', e => {
  if (e.target.closest('button')) tocarSomDeToque();
});

/* Fala em voz alta o andar quando a cabine chega */
function falarAndar(rotulo) {
  if (!("speechSynthesis" in window)) return; // navegador sem suporte: ignora silenciosamente
  const texto = rotulo === "T" ? "Térreo" : `${rotulo}º andar`;
  const fala = new SpeechSynthesisUtterance(texto);
  fala.lang = 'pt-BR';
  speechSynthesis.cancel(); // evita fala acumulada se chegar rápido
  speechSynthesis.speak(fala);
}

/* "Aquece" o mecanismo de fala assim que o app abre (ou no primeiro toque),
   carregando a engine de voz antes de qualquer elevador chegar - assim
   a primeira fala real sai na hora, sem atraso */
function prepararVozAntecipadamente() {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.getVoices();
  const aquecimento = new SpeechSynthesisUtterance(' ');
  aquecimento.volume = 0;
  speechSynthesis.speak(aquecimento);
}
window.addEventListener('load', prepararVozAntecipadamente);
document.addEventListener('click', prepararVozAntecipadamente, { once: true });

/* Ajusta automaticamente o tamanho do painel de elevadores para caber
   inteiro na tela do celular, sem precisar rolar */
function ajustarEscalaElevadores() {
  const container = document.getElementById('telaElevadores');
  const conteudo = container.querySelector('.box');
  conteudo.style.transform = 'scale(1)'; // reseta antes de medir
  const alturaDisponivel = container.clientHeight;
  const larguraDisponivel = container.clientWidth;
  const alturaConteudo = conteudo.scrollHeight;
  const larguraConteudo = conteudo.scrollWidth;
  const escala = Math.min(alturaDisponivel / alturaConteudo, larguraDisponivel / larguraConteudo, 1);
  conteudo.style.transform = 'scale(' + escala + ')';
}
window.addEventListener('load', ajustarEscalaElevadores);
window.addEventListener('resize', ajustarEscalaElevadores);

/* ===== Tela de configuração =====
   Botão "Configuração" abre o modal. Nele dá para escolher o equipamento
   (uma aba por elevador), bloqueá-lo totalmente, colocá-lo em modo
   independente, e programar horários em que ele só atende um intervalo
   de andares. */
const modalConfig = document.getElementById('modalConfig');
const listaRestricoesEl = document.getElementById('listaRestricoes');
const toggleBloqueioEl = document.getElementById('toggleBloqueio');
const toggleIndependenteEl = document.getElementById('toggleIndependente');
const avisoIndependenteEl = document.getElementById('avisoIndependente');
const abasElevadorEl = document.getElementById('abasElevador');
let elevadorSelecionado = IDS_ELEVADORES[0];

/* Cria uma aba por elevador dinamicamente (se adicionar mais elevadores, mais abas aparecem) */
IDS_ELEVADORES.forEach((id, i) => {
  const btn = document.createElement('button');
  btn.className = 'aba-elevador' + (i === 0 ? ' ativa' : '');
  btn.dataset.elevador = id;
  btn.textContent = 'Elevador ' + id;
  btn.onclick = () => {
    document.querySelectorAll('.aba-elevador').forEach(b => b.classList.remove('ativa'));
    btn.classList.add('ativa');
    elevadorSelecionado = id;
    renderizarConfig();
  };
  abasElevadorEl.appendChild(btn);
});

document.getElementById('btnConfig').onclick = () => {
  modalConfig.style.display = 'flex';
  renderizarConfig();
};
document.getElementById('fecharConfig').onclick = () => { modalConfig.style.display = 'none'; };
modalConfig.onclick = (e) => { if (e.target === modalConfig) modalConfig.style.display = 'none'; };

toggleBloqueioEl.onchange = () => {
  configuracao[elevadorSelecionado].bloqueado = toggleBloqueioEl.checked;
};

toggleIndependenteEl.onchange = () => {
  configuracao[elevadorSelecionado].independente = toggleIndependenteEl.checked;
  atualizarEstadoVisualConfig();
};

document.getElementById('addRestricao').onclick = () => {
  configuracao[elevadorSelecionado].restricoes.push({
    dias: [1, 2, 3, 4, 5], inicio: "07:00", fim: "10:00", min: 0, max: ANDARES.length - 1
  });
  renderizarConfig();
};

document.getElementById('salvarConfig').onclick = () => {
  salvarConfiguracaoStorage();
  atualizarVisualRestricoes();
  despacharElevadoresLivres();
  modalConfig.style.display = 'none';
};

function renderizarConfig() {
  const cfg = configuracao[elevadorSelecionado];
  toggleBloqueioEl.checked = !!cfg.bloqueado;
  toggleIndependenteEl.checked = !!cfg.independente;
  listaRestricoesEl.innerHTML = "";
  cfg.restricoes.forEach((r, idx) => listaRestricoesEl.appendChild(criarLinhaRestricao(r, idx)));
  atualizarEstadoVisualConfig();
  document.getElementById('statusElevador').textContent = textoStatusAgora(elevadorSelecionado);
}

/* Esmaece a seção de restrições e mostra o aviso quando o elevador está em modo independente */
function atualizarEstadoVisualConfig() {
  const cfg = configuracao[elevadorSelecionado];
  const independente = !!cfg.independente;
  avisoIndependenteEl.style.display = independente ? 'block' : 'none';
  listaRestricoesEl.style.opacity = independente ? '.45' : '1';
  document.getElementById('addRestricao').style.opacity = independente ? '.45' : '1';
}

/* Texto de diagnóstico: mostra o que o sistema está aplicando NESTE momento
   para o elevador selecionado, pra facilitar conferir se a regra está certa */
function textoStatusAgora(id) {
  if (elevadorBloqueado(id)) return "Agora: BLOQUEADO manualmente (fora de serviço).";
  if (elevadorIndependente(id)) return "Agora: modo INDEPENDENTE — atende qualquer andar chamado, sem restrição de horário.";
  const r = restricaoAtiva(id);
  if (!r) return "Agora: sem restrição ativa — atende todos os andares.";
  if (r.min === 0 && r.max === ANDARES.length - 1) {
    return `Agora: restrição de horário ativa, mas a faixa de andares está de ${ANDARES[r.min]} até ${ANDARES[r.max]} (ou seja, todos) — ajuste "Atende de/até" se quiser limitar.`;
  }
  return `Agora: restrição ativa — atende só de ${ANDARES[r.min]} até ${ANDARES[r.max]} (até ${r.fim}).`;
}

function criarLinhaRestricao(r, idx) {
  const dias = [[1, "S"], [2, "T"], [3, "Q"], [4, "Q"], [5, "S"], [6, "S"], [0, "D"]];
  const nomesDias = {0:"Domingo",1:"Segunda",2:"Terça",3:"Quarta",4:"Quinta",5:"Sexta",6:"Sábado"};

  const opcoesAndar = (selecionado) => ANDARES.map((rotulo, i) =>
    `<option value="${i}" ${i == selecionado ? 'selected' : ''}>${rotulo}</option>`).join("");

  const div = document.createElement('div');
  div.className = 'linha-restricao';
  div.innerHTML = `
    <div class="dias-semana">
      ${dias.map(([v, letra]) => `<label title="${nomesDias[v]}"><input type="checkbox" value="${v}" ${r.dias.includes(v) ? 'checked' : ''}>${letra}</label>`).join("")}
    </div>
    <div class="horarios">
      <input type="time" class="hora-inicio" value="${r.inicio}">
      <span>até</span>
      <input type="time" class="hora-fim" value="${r.fim}">
    </div>
    <div class="faixa-andares">
      <span>Atende de</span>
      <select class="andar-min">${opcoesAndar(r.min)}</select>
      <span>até</span>
      <select class="andar-max">${opcoesAndar(r.max)}</select>
    </div>
    <button class="remover-restricao">Remover horário</button>
  `;

  div.querySelectorAll('.dias-semana input').forEach(chk => {
    chk.onchange = () => {
      const valor = Number(chk.value);
      if (chk.checked) { if (!r.dias.includes(valor)) r.dias.push(valor); }
      else { r.dias = r.dias.filter(d => d !== valor); }
    };
  });
  div.querySelector('.hora-inicio').onchange = e => r.inicio = e.target.value;
  div.querySelector('.hora-fim').onchange = e => r.fim = e.target.value;
  div.querySelector('.andar-min').onchange = e => r.min = Number(e.target.value);
  div.querySelector('.andar-max').onchange = e => r.max = Number(e.target.value);
  div.querySelector('.remover-restricao').onclick = () => {
    configuracao[elevadorSelecionado].restricoes.splice(idx, 1);
    renderizarConfig();
  };

  return div;
}

/* Atualiza visualmente os painéis, cabines e botões internos de acordo com o
   bloqueio/independente/restrição vigente no momento (chamada ao carregar e
   a cada 15s, já que uma restrição por horário pode começar/terminar sem
   recarregar a página) */
function atualizarVisualRestricoes() {
  elevadores.forEach(e => {
    const painel = document.getElementById('painel' + e.id).parentElement;
    const cabine = e.elemento;
    const bloqueado = elevadorBloqueado(e.id);
    const independente = elevadorIndependente(e.id);

    painel.classList.toggle('painel-bloqueado', bloqueado);
    painel.classList.toggle('painel-independente', independente);
    cabine.classList.toggle('cabine-bloqueada', bloqueado);
    cabine.classList.toggle('cabine-independente', independente);

    if (!e.emMovimento && !e.elemento.classList.contains('parada')) {
      e.display.textContent = bloqueado ? 'OFF' : ANDARES[e.andarAtual];
    }

    ANDARES.forEach((_, i) => {
      e.botoesInternos[i].disabled = !andarPermitido(e.id, i);
    });
  });
}
window.addEventListener('load', atualizarVisualRestricoes);
setInterval(() => {
  atualizarVisualRestricoes();
  despacharElevadoresLivres();
  if (modalConfig.style.display === 'flex') renderizarConfig();
}, 15000);
</script>
