<!DOCTYPE html>
<html lang="pt-BR">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supervisório Duplex</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#10141f;
  color:#fff;
  font:12px Arial;
  text-align:center
}

h2{
  text-align:left;
  margin:8px 15px
}

.box{
  display:flex;
  gap:6px;
  justify-content:center;
  align-items:flex-start
}

#telaElevadores{
  width:100%;
  height:calc(100vh - 68px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  overflow:hidden
}

#telaElevadores .box{
  transform-origin:top center
}

.topo{
  position:relative;
  background:#141a2e;
  padding:20px 16px;
  border-bottom:1px solid #232a44
}

.topo h1{
  margin:0;
  font-size:26px;
  font-weight:800;
  color:#fff;
  text-align:center
}

.btn-config{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  background:#232a44;
  border:1px solid #35d9ff;
  color:#35d9ff;
  padding:8px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer
}

.btn-config:active{
  transform:translateY(-50%) scale(.95)
}

.paineis{
  display:grid;
  grid-template-columns:repeat(2,82px);
  grid-auto-rows:350px;
  gap:6px
}


/* =========================================================
   PAINEL DOS ELEVADORES
========================================================= */

.painel{
  width:82px;
  height:350px;
  background:linear-gradient(
    135deg,
    #c8ccd0,
    #9aa0a6 40%,
    #c8ccd0 60%,
    #8a9096
  );

  border:3px solid #6b7076;

  padding:4px;

  box-shadow:
    inset 0 1px 3px rgba(255,255,255,.4);

  position:relative;
}


/* =========================================================
   IDENTIFICAÇÃO DOS ELEVADORES
========================================================= */

.painel-elevador-1{
  border-color:#35a7ff;

  box-shadow:
    0 0 7px rgba(53,167,255,.55),
    inset 0 1px 3px rgba(255,255,255,.4)
}

.painel-elevador-2{
  border-color:#35e06f;

  box-shadow:
    0 0 7px rgba(53,224,111,.55),
    inset 0 1px 3px rgba(255,255,255,.4)
}

.painel-elevador-3{
  border-color:#b66cff;

  box-shadow:
    0 0 7px rgba(182,108,255,.55),
    inset 0 1px 3px rgba(255,255,255,.4)
}

.painel-elevador-4{
  border-color:#ff8c32;

  box-shadow:
    0 0 7px rgba(255,140,50,.55),
    inset 0 1px 3px rgba(255,255,255,.4)
}


/* =========================================================
   IDENTIFICAÇÃO ESCRITA
========================================================= */

.identificacao-elevador{
  width:100%;
  height:23px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:3px;

  border-radius:4px;

  background:#161b27;

  color:#fff;

  font-size:9px;
  font-weight:bold;

  letter-spacing:.4px;

  text-shadow:
    0 0 4px currentColor;
}


/* Cores da identificação */

.painel-elevador-1 .identificacao-elevador{
  color:#35a7ff;
  border:1px solid #35a7ff
}

.painel-elevador-2 .identificacao-elevador{
  color:#35e06f;
  border:1px solid #35e06f
}

.painel-elevador-3 .identificacao-elevador{
  color:#b66cff;
  border:1px solid #b66cff
}

.painel-elevador-4 .identificacao-elevador{
  color:#ff8c32;
  border:1px solid #ff8c32
}


/* =========================================================
   BOTÕES INTERNOS
========================================================= */

.painel-elevador-1 .botao{
  border-color:#35a7ff
}

.painel-elevador-2 .botao{
  border-color:#35e06f
}

.painel-elevador-3 .botao{
  border-color:#b66cff
}

.painel-elevador-4 .botao{
  border-color:#ff8c32
}


.painel-elevador-1 .botao.ativo{
  border-color:#35a7ff;

  box-shadow:
    0 0 10px #35a7ff,
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35)
}

.painel-elevador-2 .botao.ativo{
  border-color:#35e06f;

  box-shadow:
    0 0 10px #35e06f,
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35)
}

.painel-elevador-3 .botao.ativo{
  border-color:#b66cff;

  box-shadow:
    0 0 10px #b66cff,
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35)
}

.painel-elevador-4 .botao.ativo{
  border-color:#ff8c32;

  box-shadow:
    0 0 10px #ff8c32,
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35)
}


/* =========================================================
   ESTADO INDEPENDENTE = AMARELO
========================================================= */

.painel-independente{
  border-color:#ffb52e !important;

  box-shadow:
    0 0 9px rgba(255,181,46,.65),
    inset 0 1px 3px rgba(255,255,255,.4) !important
}

.painel-independente .botao{
  border-color:#ffb52e !important
}

.painel-independente .botao.ativo{
  border-color:#ffb52e !important;

  box-shadow:
    0 0 10px #ffb52e,
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35)
}

.painel-independente .identificacao-elevador{
  color:#ffb52e !important;
  border-color:#ffb52e !important
}


/* =========================================================
   ESTADO BLOQUEADO = VERMELHO
   TEM PRIORIDADE SOBRE O AMARELO
========================================================= */

.painel-bloqueado{
  opacity:.65;

  border-color:#ff3030 !important;

  box-shadow:
    0 0 10px rgba(255,48,48,.7),
    inset 0 1px 3px rgba(255,255,255,.4) !important
}

.painel-bloqueado .botao{
  border-color:#ff3030 !important
}

.painel-bloqueado .identificacao-elevador{
  color:#ff3030 !important;
  border-color:#ff3030 !important
}


/* =========================================================
   PAINEL DE BOTOEIRA
========================================================= */

.painel-botoes{
  height:326px;

  display:grid;

  grid-template-columns:33px 33px;
  grid-template-rows:52px repeat(5,45px);

  gap:3px;

  justify-content:center
}


/* =========================================================
   DISPLAY
========================================================= */

.display{
  width:68px;
  height:48px;

  margin:auto;

  background:#55d52f;

  border:3px inset #222;

  color:#000;

  font:bold 25px monospace;

  display:grid;

  place-items:center;

  box-shadow:
    inset 0 0 8px #173b10
}

.painel-botoes .display{
  grid-column:1/3
}


/* =========================================================
   BOTÕES
========================================================= */

.botao{
  width:33px;
  height:38px;

  border-radius:50%;

  border:2px solid #6b7076;

  background:
    radial-gradient(
      circle at 35% 30%,
      #f5f6f7,
      #c9cdd1 45%,
      #9aa0a6 75%,
      #7d8388
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35),
    0 1px 2px rgba(0,0,0,.4);

  font-weight:bold;

  padding:0;

  font-size:14px;

  color:#2a2d30;

  text-shadow:
    0 1px 0 rgba(255,255,255,.5)
}

.ativo{
  border:2px solid #35d9ff;

  box-shadow:
    0 0 10px #35d9ff,
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35)
}

.botao:disabled{
  opacity:.3;
  cursor:not-allowed;
  box-shadow:none
}

button{
  transition:
    transform .06s ease,
    filter .06s ease,
    background-color .06s ease
}

.botao:active{
  transform:scale(.93);
  filter:brightness(.8)
}


/* =========================================================
   POÇO
========================================================= */

#poco{
  position:relative;

  height:700px;

  background:#555;

  border:5px solid #333;

  overflow:hidden
}

.linha-andar{
  position:absolute;

  left:0;

  width:100%;

  height:2px;

  background:#ddd
}


/* =========================================================
   CABINES DOS ELEVADORES
========================================================= */

.cabine{
  position:absolute;

  height:66px;

  bottom:0;

  background:#777;

  border:4px solid #111;

  z-index:2;

  box-shadow:
    0 2px 6px #111;

  transition:
    border-color .2s ease,
    box-shadow .2s ease
}


/* =========================================================
   CONTORNO DA CABINE - ELEVADOR 1
========================================================= */

.cabine-elevador-1{
  border-color:#35a7ff;

  box-shadow:
    0 0 8px rgba(53,167,255,.75),
    0 2px 6px #111
}


/* =========================================================
   CONTORNO DA CABINE - ELEVADOR 2
========================================================= */

.cabine-elevador-2{
  border-color:#35e06f;

  box-shadow:
    0 0 8px rgba(53,224,111,.75),
    0 2px 6px #111
}


/* =========================================================
   CONTORNO DA CABINE - ELEVADOR 3
========================================================= */

.cabine-elevador-3{
  border-color:#b66cff;

  box-shadow:
    0 0 8px rgba(182,108,255,.75),
    0 2px 6px #111
}


/* =========================================================
   CONTORNO DA CABINE - ELEVADOR 4
========================================================= */

.cabine-elevador-4{
  border-color:#ff8c32;

  box-shadow:
    0 0 8px rgba(255,140,50,.75),
    0 2px 6px #111
}


/* =========================================================
   CABINE INDEPENDENTE = AMARELO
========================================================= */

.cabine-independente{
  border-color:#ffb52e !important;

  box-shadow:
    0 0 10px rgba(255,181,46,.9),
    0 2px 6px #111 !important
}


/* =========================================================
   CABINE BLOQUEADA = VERMELHO
========================================================= */

.cabine-bloqueada{
  border-color:#ff3030 !important;

  box-shadow:
    0 0 10px rgba(255,48,48,.9),
    0 2px 6px #111 !important
}


.luz-interna{
  position:absolute;
  inset:0;

  background:#fff;

  opacity:0
}

.parada .luz-interna{
  opacity:1
}

.porta{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:3
}

.folha{
  position:absolute;

  top:0;

  width:50%;
  height:100%;

  background:#777;

  border:2px solid #222;

  transition:.8s
}

.folha:first-child{
  left:0
}

.folha:last-child{
  right:0
}

.aberta .folha:first-child{
  left:-50%
}

.aberta .folha:last-child{
  right:-50%
}

.pessoas{
  position:absolute;

  left:-20px;
  top:10px;

  width:80px;
  height:55px;

  z-index:5
}

.pessoa{
  position:absolute;

  bottom:0;

  width:8px;
  height:24px;

  background:#222;

  border-radius:5px;

  opacity:0
}

.pessoa:before{
  content:"";

  position:absolute;

  width:8px;
  height:8px;

  background:#222;

  border-radius:50%;

  top:-8px
}

.entrando{
  animation:andar 2s linear forwards
}

@keyframes andar{

  0%{
    left:-12px;
    opacity:1
  }

  100%{
    left:35px;
    opacity:1
  }

}


/* =========================================================
   PAVIMENTOS
========================================================= */

#pavimentos{
  width:125px;
  height:700px;

  display:flex;
  flex-direction:column
}

.pavimento{
  width:125px;
  height:70px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:10px;

  background:
    linear-gradient(
      135deg,
      #c8ccd0,
      #9aa0a6 40%,
      #c8ccd0 60%,
      #8a9096
    );

  border:3px solid #6b7076;

  flex:none;

  box-shadow:
    inset 0 1px 3px rgba(255,255,255,.4)
}

.pavimento .display{
  width:48px;
  height:38px;

  font-size:20px
}

.pavimento .botao{
  width:34px;
  height:34px
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.65);

  z-index:1000;

  align-items:center;
  justify-content:center;

  padding:16px
}

.modal-painel{
  background:#1b2136;

  border:1px solid #2c3454;

  border-radius:10px;

  width:100%;

  max-width:420px;

  max-height:88vh;

  overflow-y:auto;

  padding:16px;

  text-align:left
}

.modal-cabecalho{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:8px
}

.modal-cabecalho h3{
  margin:0;

  font-size:17px
}

.botao-fechar{
  background:none;

  border:none;

  color:#fff;

  font-size:20px;

  cursor:pointer;

  line-height:1
}

.abas-elevador{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:6px;

  margin:10px 0 14px
}

.aba-elevador{
  padding:9px 4px;

  background:#232a44;

  border:1px solid #343d5e;

  color:#aab0c8;

  border-radius:6px;

  cursor:pointer;

  font-size:13px;

  font-weight:bold
}

.aba-elevador.ativa{
  background:#35d9ff;

  border-color:#35d9ff;

  color:#0b0e1a
}

.linha-toggle{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin:6px 0 16px;

  font-size:13px
}

.linha-toggle input{
  width:20px;
  height:20px
}

.config-corpo h4{
  margin:0 0 8px;

  font-size:13px;

  color:#aab0c8
}

.linha-restricao{
  background:#141a2e;

  border:1px solid #2c3454;

  border-radius:8px;

  padding:10px;

  margin-bottom:10px;

  font-size:12px
}

.dias-semana{
  display:flex;

  justify-content:space-between;

  margin-bottom:8px
}

.dias-semana label{
  display:flex;

  flex-direction:column;

  align-items:center;

  gap:3px;

  font-size:11px;

  color:#aab0c8
}

.dias-semana input{
  width:16px;
  height:16px
}

.horarios,
.faixa-andares{
  display:flex;

  align-items:center;

  gap:6px;

  margin-bottom:8px;

  flex-wrap:wrap
}

.horarios input,
.faixa-andares select{
  background:#0f1424;

  border:1px solid #343d5e;

  color:#fff;

  border-radius:5px;

  padding:5px;

  font-size:12px
}

.remover-restricao{
  width:100%;

  background:#3a1f28;

  border:1px solid #6b2f3e;

  color:#ff8fa3;

  border-radius:6px;

  padding:7px;

  font-size:12px;

  cursor:pointer
}

.botao-secundario{
  width:100%;

  background:#1c2440;

  border:1px dashed #35d9ff;

  color:#35d9ff;

  border-radius:6px;

  padding:9px;

  font-size:13px;

  cursor:pointer;

  margin-bottom:6px
}

.config-rodape{
  margin-top:10px
}

.botao-primario{
  width:100%;

  background:#35d9ff;

  border:none;

  color:#0b0e1a;

  border-radius:6px;

  padding:11px;

  font-size:14px;

  font-weight:bold;

  cursor:pointer
}

.indicador-independente{
  color:#ffb52e;

  font-size:10px;

  font-weight:bold;

  margin-top:2px
}

</style>

<body>

<div class="topo">

  <h1>Supervisório Duplex</h1>

  <button
    id="btnConfig"
    class="btn-config"
    title="Configuração"
  >
    ⚙ Configuração
  </button>

</div>


<div id="telaElevadores">

  <div class="box">

    <div
      class="paineis"
      id="paineis"
    ></div>


    <div>

      <b>POÇO</b>

      <div id="poco"></div>

    </div>


    <div>

      <b>PAVIMENTOS</b>

      <div id="pavimentos"></div>

    </div>

  </div>

</div>


<!-- =======================================================
     MODAL DE CONFIGURAÇÃO
======================================================= -->

<div
  id="modalConfig"
  class="modal-overlay"
>

  <div class="modal-painel">

    <div class="modal-cabecalho">

      <h3>Configuração</h3>

      <button
        id="fecharConfig"
        class="botao-fechar"
      >
        ✕
      </button>

    </div>


    <div
      class="abas-elevador"
      id="abasElevador"
    ></div>


    <label class="linha-toggle">

      <span>
        Bloquear elevador (fora de serviço)
      </span>

      <input
        type="checkbox"
        id="toggleBloqueio"
      >

    </label>


    <label class="linha-toggle">

      <span>
        Funcionamento independente
      </span>

      <input
        type="checkbox"
        id="toggleIndependente"
      >

    </label>


    <div class="config-corpo">

      <h4>
        Horários com restrição de andares
      </h4>


      <div
        id="avisoIndependente"
        style="
          display:none;
          background:#332b17;
          border:1px solid #8b6d24;
          color:#ffd76a;
          border-radius:7px;
          padding:9px;
          margin-bottom:10px;
          font-size:12px;
        "
      >
        No modo independente, as restrições de horário e faixa
        de andares ficam desabilitadas para este elevador.
      </div>


      <div id="listaRestricoes"></div>


      <button
        id="addRestricao"
        class="botao-secundario"
      >
        + Adicionar horário
      </button>

    </div>


    <div class="config-rodape">

      <button
        id="salvarConfig"
        class="botao-primario"
      >
        Salvar
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO GERAL
========================================================= */

const ANDARES =
  ["T",1,2,3,4,5,6,7,8,9];

const ALTURA_ANDAR = 70;

const ALTURA_MAX = 630;

const NUM_ELEVADORES = 4;

const IDS_ELEVADORES =
  Array.from(
    {length:NUM_ELEVADORES},
    (_,i)=>i+1
  );


/* =========================================================
   VELOCIDADE
========================================================= */

const VELOCIDADE_REAL_MS = 1;

const ALTURA_REAL_ANDAR_M = 3;

const SEGUNDOS_POR_ANDAR =
  ALTURA_REAL_ANDAR_M /
  VELOCIDADE_REAL_MS;

const FATOR_VELOCIDADE =
  (
    ALTURA_ANDAR /
    SEGUNDOS_POR_ANDAR /
    60
  ) / 2.8;


/* =========================================================
   ELEMENTOS
========================================================= */

const poco =
  document.getElementById("poco");

const listaPavimentos =
  document.getElementById("pavimentos");

const botoesPavimento = [];

const chamadasPendentes =
  new Set();


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const CHAVE_CONFIG =
  "supervisorioConfig";


function configuracaoPadrao(){

  const cfg = {};

  IDS_ELEVADORES.forEach(id=>{

    cfg[id] = {

      bloqueado:false,

      independente:false,

      restricoes:[]

    };

  });

  return cfg;

}


function carregarConfiguracao(){

  let salvo = null;

  try{

    salvo =
      JSON.parse(
        localStorage.getItem(
          CHAVE_CONFIG
        )
      );

  }catch(e){}


  const padrao =
    configuracaoPadrao();


  if(!salvo)
    return padrao;


  IDS_ELEVADORES.forEach(id=>{

    if(!salvo[id])
      salvo[id] = padrao[id];

    if(
      typeof salvo[id].bloqueado !==
      "boolean"
    )
      salvo[id].bloqueado = false;

    if(
      typeof salvo[id].independente !==
      "boolean"
    )
      salvo[id].independente = false;

    if(
      !Array.isArray(
        salvo[id].restricoes
      )
    )
      salvo[id].restricoes = [];

  });


  return salvo;

}


function salvarConfiguracaoStorage(){

  localStorage.setItem(
    CHAVE_CONFIG,
    JSON.stringify(
      configuracao
    )
  );

}


let configuracao =
  carregarConfiguracao();


function elevadorBloqueado(id){

  return !!(
    configuracao[id] &&
    configuracao[id].bloqueado
  );

}


function elevadorIndependente(id){

  return !!(
    configuracao[id] &&
    configuracao[id].independente
  );

}


/* =========================================================
   RESTRIÇÕES
========================================================= */

function restricaoAtiva(id){

  const cfg =
    configuracao[id];


  if(!cfg)
    return null;


  if(cfg.independente)
    return null;


  const agora =
    new Date();


  const dia =
    agora.getDay();


  const minutosAgora =
    agora.getHours()*60 +
    agora.getMinutes();


  return cfg.restricoes.find(r=>{

    if(!r.dias.includes(dia))
      return false;


    const [hi,mi] =
      r.inicio.split(":")
      .map(Number);


    const [hf,mf] =
      r.fim.split(":")
      .map(Number);


    const minutosInicio =
      hi*60+mi;


    const minutosFim =
      hf*60+mf;


    return (
      minutosAgora >= minutosInicio &&
      minutosAgora < minutosFim
    );

  }) || null;

}


/* =========================================================
   ANDAR PERMITIDO
========================================================= */

function andarPermitido(
  id,
  andar
){

  if(elevadorBloqueado(id))
    return false;


  if(elevadorIndependente(id))
    return true;


  const r =
    restricaoAtiva(id);


  if(!r)
    return true;


  return (
    andar >= r.min &&
    andar <= r.max
  );

}

/* =========================================================
   CHAMADA INTERNA
========================================================= */

function chamarDeDentro(
  elevador,
  andar,
  botao
){

  if(
    elevadorBloqueado(
      elevador.id
    )
  )
    return;


  if(
    !andarPermitido(
      elevador.id,
      andar
    )
  )
    return;


  if(
    andar ==
      elevador.andarAtual &&
    !elevador.emMovimento
  ){

    return abrirPortas(
      elevador
    );

  }


  elevador.destinos.add(
    andar
  );


  botao.classList.add(
    "ativo"
  );


  if(!elevador.emMovimento)
    proximoDestino(
      elevador
    );

}


/* =========================================================
   POSIÇÃO
========================================================= */

function posicaoAtualEmAndares(
  elevador
){

  return elevador.emMovimento

    ? elevador.posicaoPx /
      ALTURA_ANDAR

    : elevador.andarAtual;

}


/* =========================================================
   CHAMADA EXTERNA
========================================================= */

function chamarDeFora(
  andar,
  botao
){

  if(
    chamadasPendentes.has(
      andar
    )
  )
    return;


  chamadasPendentes.add(
    andar
  );


  botao.classList.add(
    "ativo"
  );


  const independentes =
    elevadores.filter(e=>

      elevadorIndependente(
        e.id
      ) &&

      !elevadorBloqueado(
        e.id
      )

    );


  if(independentes.length){

    const escolhido =
      independentes
        .slice()
        .sort((a,b)=>

          Math.abs(
            posicaoAtualEmAndares(a) -
            andar
          )

          -

          Math.abs(
            posicaoAtualEmAndares(b) -
            andar
          )

        )[0];


    escolhido.destinos.add(
      andar
    );


    if(!escolhido.emMovimento)
      proximoDestino(
        escolhido
      );


    return;

  }


  const jaParado =
    elevadores.find(e=>

      !e.emMovimento &&

      e.andarAtual ==
      andar &&

      andarPermitido(
        e.id,
        andar
      ) &&

      !elevadorIndependente(
        e.id
      )

    );


  if(jaParado)
    return atenderChamadaImediata(
      jaParado,
      andar
    );


  const emRota =
    elevadores.find(e=>

      !elevadorIndependente(
        e.id
      ) &&

      e.emMovimento &&

      andarPermitido(
        e.id,
        andar
      ) &&

      (

        (
          e.direcao > 0 &&
          andar >
          posicaoAtualEmAndares(e)
        )

        ||

        (
          e.direcao < 0 &&
          andar <
          posicaoAtualEmAndares(e)
        )

      )

    );


  if(emRota){

    emRota.destinos.add(
      andar
    );

    return;

  }


  despacharElevadoresLivres();

}


/* =========================================================
   DESPACHO
========================================================= */

function despacharElevadoresLivres(){

  elevadores

    .filter(e=>

      !e.emMovimento &&

      !elevadorBloqueado(
        e.id
      ) &&

      !elevadorIndependente(
        e.id
      )

    )

    .forEach(e=>{

      const maisProximo =
        [...chamadasPendentes]

          .filter(andar=>

            andarPermitido(
              e.id,
              andar
            ) &&

            !e.destinos.has(
              andar
            ) &&

            !elevadores.some(
              outro =>

                outro !== e &&

                !elevadorIndependente(
                  outro.id
                ) &&

                outro.emMovimento &&

                outro.destinos.has(
                  andar
                )

            )

          )

          .sort((a,b)=>

            Math.abs(
              e.andarAtual-a
            )

            -

            Math.abs(
              e.andarAtual-b
            )

          )[0];


      if(
        maisProximo != null
      ){

        e.destinos.add(
          maisProximo
        );

        proximoDestino(e);

      }

    });

}


/* =========================================================
   PRÓXIMO DESTINO
========================================================= */

function proximoDestino(
  elevador
){

  if(
    !elevador.destinos.size
  ){

    elevador.emMovimento = 0;

    elevador.direcao = 0;


    if(
      !elevadorIndependente(
        elevador.id
      )
    )
      despacharElevadoresLivres();


    agendarRetornoAoTerreo(
      elevador
    );

    return;

  }


  const acima =
    [...elevador.destinos]
      .filter(
        a =>
          a >
          elevador.andarAtual
      )
      .sort(
        (a,b)=>a-b
      );


  const abaixo =
    [...elevador.destinos]
      .filter(
        a =>
          a <
          elevador.andarAtual
      )
      .sort(
        (a,b)=>b-a
      );


  const destino =

    (
      elevador.direcao > 0 &&
      acima.length
    )

      ? acima[0]

      :

    (
      elevador.direcao < 0 &&
      abaixo.length
    )

      ? abaixo[0]

      :

    acima.length
      ? acima[0]
      : abaixo[0];


  moverAte(
    elevador,
    destino
  );

}


/* =========================================================
   RETORNO AO TÉRREO
========================================================= */

const TEMPO_ESPERA_RETORNO_TERREO =
  6000;


function agendarRetornoAoTerreo(
  elevador
){

  setTimeout(()=>{

    const aindaOcioso =

      !elevador.emMovimento &&

      !elevador.destinos.size &&

      !chamadasPendentes.size;


    if(

      aindaOcioso &&

      elevador.andarAtual !== 0 &&

      !elevadorBloqueado(
        elevador.id
      )

    ){

      elevador.destinos.add(
        0
      );

      proximoDestino(
        elevador
      );

    }

  },TEMPO_ESPERA_RETORNO_TERREO);

}


/* =========================================================
   MOVIMENTO
========================================================= */

function moverAte(
  elevador,
  andarDestino
){

  elevador.emMovimento = 1;


  elevador.direcao =
    andarDestino >
    elevador.andarAtual
      ? 1
      : -1;


  elevador.porta.classList.remove(
    "aberta"
  );


  setTimeout(()=>{

    const alvoPx =
      andarDestino *
      ALTURA_ANDAR;


    function passoDaAnimacao(){

      const distancia =
        alvoPx -
        elevador.posicaoPx;


      const velocidade =
        Math.min(
          2.8,
          Math.max(
            .4,
            Math.abs(
              distancia
            )/35
          )
        ) *
        FATOR_VELOCIDADE;


      elevador.posicaoPx +=
        elevador.direcao *
        velocidade;


      elevador.posicaoPx =
        Math.max(
          0,
          Math.min(
            ALTURA_MAX,
            elevador.posicaoPx
          )
        );


      elevador.elemento.style.bottom =
        elevador.posicaoPx+"px";


      elevador.display.textContent =
        ANDARES[
          Math.round(
            elevador.posicaoPx /
            ALTURA_ANDAR
          )
        ];


      const chegou =

        (
          elevador.direcao > 0 &&
          elevador.posicaoPx >=
          alvoPx
        )

        ||

        (
          elevador.direcao < 0 &&
          elevador.posicaoPx <=
          alvoPx
        );


      if(chegou){

        elevador.posicaoPx =
          alvoPx;


        elevador.andarAtual =
          andarDestino;


        elevador.elemento.style.bottom =
          elevador.posicaoPx+"px";


        elevador.display.textContent =
          ANDARES[
            andarDestino
          ];


        falarAndar(
          ANDARES[
            andarDestino
          ]
        );


        elevador.destinos.delete(
          andarDestino
        );


        if(
          chamadasPendentes.has(
            andarDestino
          )
        ){

          chamadasPendentes.delete(
            andarDestino
          );


          botoesPavimento[
            andarDestino
          ].classList.remove(
            "ativo"
          );


          elevadores.forEach(e=>
            e.destinos.delete(
              andarDestino
            )
          );

        }


        elevador
          .botoesInternos[
            andarDestino
          ]
          .classList.remove(
            "ativo"
          );


        abrirPortas(
          elevador
        );


        return;

      }


      requestAnimationFrame(
        passoDaAnimacao
      );

    }


    requestAnimationFrame(
      passoDaAnimacao
    );

  },300);

}


/* =========================================================
   ATENDIMENTO IMEDIATO
========================================================= */

function atenderChamadaImediata(
  elevador,
  andar
){

  elevador.destinos.delete(
    andar
  );


  chamadasPendentes.delete(
    andar
  );


  botoesPavimento[
    andar
  ].classList.remove(
    "ativo"
  );


  elevadores.forEach(e=>
    e.destinos.delete(
      andar
    )
  );


  abrirPortas(
    elevador
  );

}


/* =========================================================
   PORTAS
========================================================= */

function abrirPortas(
  elevador
){

  elevador.elemento.classList.add(
    "parada"
  );


  elevador.porta.classList.add(
    "aberta"
  );


  elevador.areaPessoas.innerHTML =
    "";


  for(
    let i=0;
    i<2;
    i++
  ){

    const pessoa =
      document.createElement(
        "i"
      );


    pessoa.className =
      "pessoa entrando";


    pessoa.style.left =
      (-12+i*8)+"px";


    pessoa.style.animationDelay =
      i*.3+"s";


    elevador.areaPessoas.append(
      pessoa
    );

  }


  setTimeout(()=>{

    elevador.porta.classList.remove(
      "aberta"
    );


    setTimeout(()=>{

      elevador.elemento.classList.remove(
        "parada"
      );


      elevador.areaPessoas.innerHTML =
        "";


      if(
        elevador.destinos.size
      ){

        proximoDestino(
          elevador
        );

      }else{

        elevador.emMovimento = 0;

        elevador.direcao = 0;

        agendarRetornoAoTerreo(
          elevador
        );

      }


      if(
        !elevadorIndependente(
          elevador.id
        )
      ){

        despacharElevadoresLivres();

      }

    },800);

  },2000);

}


/* =========================================================
   ÁUDIO
========================================================= */

let contextoAudio = null;


function tocarSomDeToque(){

  try{

    contextoAudio =
      contextoAudio ||
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const osc =
      contextoAudio.createOscillator();


    const ganho =
      contextoAudio.createGain();


    osc.type = "sine";

    osc.frequency.value =
      850;


    ganho.gain.setValueAtTime(
      .15,
      contextoAudio.currentTime
    );


    ganho.gain.exponentialRampToValueAtTime(
      .001,
      contextoAudio.currentTime+.1
    );


    osc.connect(ganho);

    ganho.connect(
      contextoAudio.destination
    );


    osc.start();

    osc.stop(
      contextoAudio.currentTime+.1
    );

  }catch(e){}

}


document.addEventListener(
  "click",
  e=>{

    if(
      e.target.closest("button")
    )
      tocarSomDeToque();

  }
);


/* =========================================================
   VOZ
========================================================= */

function falarAndar(rotulo){

  if(
    !("speechSynthesis" in window)
  )
    return;


  const texto =
    rotulo === "T"
      ? "Térreo"
      : `${rotulo}º andar`;


  const fala =
    new SpeechSynthesisUtterance(
      texto
    );


  fala.lang =
    "pt-BR";


  speechSynthesis.cancel();

  speechSynthesis.speak(
    fala
  );

}


function prepararVozAntecipadamente(){

  if(
    !("speechSynthesis" in window)
  )
    return;


  speechSynthesis.getVoices();


  const aquecimento =
    new SpeechSynthesisUtterance(
      " "
    );


  aquecimento.volume = 0;

  speechSynthesis.speak(
    aquecimento
  );

}


window.addEventListener(
  "load",
  prepararVozAntecipadamente
);

========================================================= */

function ajustarEscalaElevadores(){

  const container =
    document.getElementById(
      "telaElevadores"
    );


  const conteudo =
    container.querySelector(
      ".box"
    );


  conteudo.style.transform =
    "scale(1)";


  const alturaDisponivel =
    container.clientHeight;


  const larguraDisponivel =
    container.clientWidth;


  const alturaConteudo =
    conteudo.scrollHeight;


  const larguraConteudo =
    conteudo.scrollWidth;


  const escala =
    Math.min(

      alturaDisponivel /
      alturaConteudo,

      larguraDisponivel /
      larguraConteudo,

      1

    );


  conteudo.style.transform =
    "scale("+escala+")";

}

  avisoIndependenteEl.style.display =
    independente
      ? "block"
      : "none";


  listaRestricoesEl.style.opacity =
    independente
      ? ".45"
      : "1";


  document.getElementById(
    "addRestricao"
  ).style.opacity =
    independente
      ? ".45"
      : "1";

}


/* =========================================================
   CRIAR RESTRIÇÃO
========================================================= */

function criarLinhaRestricao(
  r,
  idx
){

  const dias = [

    [1,"S"],
    [2,"T"],
    [3,"Q"],
    [4,"Q"],
    [5,"S"],
    [6,"S"],
    [0,"D"]

  ];


  const nomesDias = {

    0:"Domingo",
    1:"Segunda",
    2:"Terça",
    3:"Quarta",
    4:"Quinta",
    5:"Sexta",
    6:"Sábado"

  };


  const opcoesAndar =
    selecionado =>

      ANDARES.map(
        (rotulo,i)=>

          `<option
            value="${i}"
            ${
              i==selecionado
                ? "selected"
                : ""
            }
          >
            ${rotulo}
          </option>`

      ).join("");


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "linha-restricao";


  div.innerHTML = `

    <div class="dias-semana">

      ${
        dias.map(
          ([v,letra])=>

            `
            <label
              title="${nomesDias[v]}"
            >

              <input
                type="checkbox"
                value="${v}"
                ${
                  r.dias.includes(v)
                    ? "checked"
                    : ""
                }
              >

              ${letra}

            </label>
            `

        ).join("")
      }

    </div>


    <div class="horarios">

      <input
        type="time"
        class="hora-inicio"
        value="${r.inicio}"
      >

      <span>até</span>

      <input
        type="time"
        class="hora-fim"
        value="${r.fim}"
      >

    </div>


    <div class="faixa-andares">

      <span>Atende de</span>

      <select class="andar-min">
        ${opcoesAndar(r.min)}
      </select>

      <span>até</span>

      <select class="andar-max">
        ${opcoesAndar(r.max)}
      </select>

    </div>


    <button class="remover-restricao">
      Remover horário
    </button>

  `;


  div
    .querySelectorAll(
      ".dias-semana input"
    )
    .forEach(chk=>{

      chk.onchange = ()=>{

        const valor =
          Number(
            chk.value
          );


        if(chk.checked){

          if(
            !r.dias.includes(
              valor
            )
          )
            r.dias.push(
              valor
            );

        }else{

          r.dias =
            r.dias.filter(
              d =>
                d !== valor
            );

        }

      };

    });


  div.querySelector(
    ".hora-inicio"
  ).onchange =
    e =>
      r.inicio =
        e.target.value;


  div.querySelector(
    ".hora-fim"
  ).onchange =
    e =>
      r.fim =
        e.target.value;


  div.querySelector(
    ".andar-min"
  ).onchange =
    e =>
      r.min =
        Number(
          e.target.value
        );


  div.querySelector(
    ".andar-max"
  ).onchange =
    e =>
      r.max =
        Number(
          e.target.value
        );


  div.querySelector(
    ".remover-restricao"
  ).onclick = ()=>{

    configuracao[
      elevadorSelecionado
    ].restricoes.splice(
      idx,
      1
    );


    renderizarConfig();

  };


  return div;

}


/* =========================================================
   ATUALIZAÇÃO VISUAL
========================================================= */

function atualizarVisualRestricoes(){

  elevadores.forEach(e=>{

    const painel =
      document.getElementById(
        "painel"+e.id
      ).parentElement;


    const cabine =
      e.elemento;


    const bloqueado =
      elevadorBloqueado(
        e.id
      );


    const independente =
      elevadorIndependente(
        e.id
      );


    /* PAINEL */

    painel.classList.toggle(
      "painel-bloqueado",
      bloqueado
    );


    painel.classList.toggle(
      "painel-independente",
      independente
    );


    /* CABINE */

    cabine.classList.toggle(
      "cabine-bloqueada",
      bloqueado
    );


    cabine.classList.toggle(
      "cabine-independente",
      independente
    );


    /* DISPLAY */

    if(
      bloqueado &&
      !e.emMovimento &&
      !e.elemento.classList.contains(
        "parada"
      )
    ){

      e.display.textContent =
        "OFF";

    }


    if(
      !bloqueado &&
      !e.emMovimento &&
      !e.elemento.classList.contains(
        "parada"
      )
    ){

      e.display.textContent =
        ANDARES[
          e.andarAtual
        ];

    }


    /* BOTÕES */

    ANDARES.forEach((_,i)=>{

      e.botoesInternos[i].disabled =
        !andarPermitido(
          e.id,
          i
        );

    });

  });

}


/* =========================================================
   ATUALIZAÇÃO PERIÓDICA
========================================================= */

window.addEventListener(
  "load",
  atualizarVisualRestricoes
);


setInterval(()=>{

  atualizarVisualRestricoes();

  despacharElevadoresLivres();

},15000);

</script>
