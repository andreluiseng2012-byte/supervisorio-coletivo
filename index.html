<!DOCTYPE html>
<html lang="pt-BR">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supervisório Duplex</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141f">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout geral e reset básico */
*{box-sizing:border-box}
body{margin:0;background:#10141f;color:#fff;font:12px Arial;text-align:center}
h2{text-align:left;margin:8px 15px}
.box{display:flex;gap:6px;justify-content:center;align-items:flex-start}
#telaElevadores{width:100%;height:calc(100vh - 68px);display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#telaElevadores .box{transform-origin:top center}

/* Cabeçalho com o nome do app e botão de configuração */
.topo{position:relative;background:#141a2e;padding:20px 16px;border-bottom:1px solid #232a44}
.topo h1{margin:0;font-size:26px;font-weight:800;color:#fff;text-align:center}
.btn-config{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#232a44;border:1px solid #35d9ff;color:#35d9ff;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer}
.btn-config:active{transform:translateY(-50%) scale(0.95)}

/* Painéis de botões dentro de cada elevador (cabine) - grade que comporta N elevadores */
.paineis{display:grid;grid-template-columns:repeat(2,82px);grid-auto-rows:366px;gap:6px}
.painel{width:82px;height:366px;background:linear-gradient(135deg,#c8ccd0,#9aa0a6 40%,#c8ccd0 60%,#8a9096);border:3px solid #6b7076;padding:4px;box-shadow:inset 0 1px 3px rgba(255,255,255,.4);position:relative}

/* Identificação colorida de cada elevador (borda + brilho + etiqueta) */
.identificacao-elevador{width:100%;height:23px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;border-radius:4px;background:#161b27;color:#fff;font-size:9px;font-weight:bold;letter-spacing:.4px;text-shadow:0 0 4px currentColor}
.painel-elevador-1{border-color:#35a7ff;box-shadow:0 0 7px rgba(53,167,255,.55),inset 0 1px 3px rgba(255,255,255,.4)}
.painel-elevador-2{border-color:#35e06f;box-shadow:0 0 7px rgba(53,224,111,.55),inset 0 1px 3px rgba(255,255,255,.4)}
.painel-elevador-3{border-color:#b66cff;box-shadow:0 0 7px rgba(182,108,255,.55),inset 0 1px 3px rgba(255,255,255,.4)}
.painel-elevador-4{border-color:#ff8c32;box-shadow:0 0 7px rgba(255,140,50,.55),inset 0 1px 3px rgba(255,255,255,.4)}
.painel-elevador-1 .identificacao-elevador{color:#35a7ff;border:1px solid #35a7ff}
.painel-elevador-2 .identificacao-elevador{color:#35e06f;border:1px solid #35e06f}
.painel-elevador-3 .identificacao-elevador{color:#b66cff;border:1px solid #b66cff}
.painel-elevador-4 .identificacao-elevador{color:#ff8c32;border:1px solid #ff8c32}
.painel-elevador-1 .botao{border-color:#35a7ff}
.painel-elevador-2 .botao{border-color:#35e06f}
.painel-elevador-3 .botao{border-color:#b66cff}
.painel-elevador-4 .botao{border-color:#ff8c32}
.painel-elevador-1 .botao.ativo{border-color:#35a7ff;box-shadow:0 0 10px #35a7ff,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.painel-elevador-2 .botao.ativo{border-color:#35e06f;box-shadow:0 0 10px #35e06f,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.painel-elevador-3 .botao.ativo{border-color:#b66cff;box-shadow:0 0 10px #b66cff,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.painel-elevador-4 .botao.ativo{border-color:#ff8c32;box-shadow:0 0 10px #ff8c32,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}

/* Modo independente = amarelo */
.painel-independente{border-color:#ffb52e !important;box-shadow:0 0 9px rgba(255,181,46,.65),inset 0 1px 3px rgba(255,255,255,.4) !important}
.painel-independente .botao{border-color:#ffb52e !important}
.painel-independente .botao.ativo{border-color:#ffb52e !important;box-shadow:0 0 10px #ffb52e,inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35)}
.painel-independente .identificacao-elevador{color:#ffb52e !important;border-color:#ffb52e !important}

/* Bloqueado = vermelho (tem prioridade sobre o amarelo) */
.painel-bloqueado{opacity:.65;border-color:#ff3030 !important;box-shadow:0 0 10px rgba(255,48,48,.7),inset 0 1px 3px rgba(255,255,255,.4) !important}
.painel-bloqueado .botao{border-color:#ff3030 !important}
.painel-bloqueado .identificacao-elevador{color:#ff3030 !important;border-color:#ff3030 !important}

.painel-botoes{height:326px;display:grid;grid-template-columns:33px 33px;grid-template-rows:52px repeat(5,45px);gap:3px;justify-content:center}
.display{width:68px;height:48px;margin:auto;background:#55d52f;border:3px inset #222;color:#000;font:bold 25px monospace;display:grid;place-items:center;box-shadow:inset 0 0 8px #173b10}
.painel-botoes
